name: Build NEXUS
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m zipfile -e NEXUS_proyecto.zip .
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Forzar compileSdk 36 en todos los módulos
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/nexus-sdk.gradle <<'EOF'
          allprojects {
              afterEvaluate { p ->
                  def a = p.extensions.findByName('android')
                  if (a != null) {
                      try { a.compileSdk = 36 } catch (Throwable t) {
                          try { a.compileSdkVersion(36) } catch (Throwable t2) {}
                      }
                  }
              }
          }
          EOF
      - run: bash tool/bootstrap.sh
        working-directory: nexus
      - name: Versiones
        run: |
          flutter --version
          java -version
          grep -rE "distributionUrl|com.android.application|org.jetbrains.kotlin.android" android/gradle/wrapper/gradle-wrapper.properties android/settings.gradle* || true
        working-directory: nexus
      - run: flutter pub get
        working-directory: nexus
      - run: flutter build apk --release
        working-directory: nexus
      - name: Verificar APK
        run: |
          ls -lh build/app/outputs/flutter-apk/app-release.apk
          test -s build/app/outputs/flutter-apk/app-release.apk
        working-directory: nexus
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-android-apk
          path: nexus/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m zipfile -e NEXUS_proyecto.zip .
        shell: bash
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: bash tool/bootstrap.sh
        shell: bash
        working-directory: nexus
      - run: flutter pub get
        working-directory: nexus
      - run: flutter build windows --release
        working-directory: nexus
      - run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath nexus-windows.zip
        working-directory: nexus
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-windows
          path: nexus/nexus-windows.zip
          if-no-files-found: error
